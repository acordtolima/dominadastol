<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7A1F2B">
  <title>Dominadas</title>
  <style>
    /* Pantalla fija: sin scroll ni zoom al tocar, también dentro de un iframe. */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #146b34;
      color: #f6e7b2;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #escenario {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }

    #cancha {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    body[data-fase="jugando"] #cancha { cursor: crosshair; }

    #hud {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 0;
      pointer-events: none;
    }

    .placa {
      min-width: 92px;
      padding: 6px 12px 8px;
      text-align: center;
      background: rgba(122, 31, 43, 0.94);
      border: 1px solid #d4a017;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .placa span {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f6e7b2;
    }

    .placa strong {
      display: block;
      margin-top: 2px;
      font-family: "Arial Black", Impact, "Haettenschweiler", sans-serif;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      color: #fff8df;
      font-variant-numeric: tabular-nums;
    }

    .golpe { animation: pop 180ms ease-out; }

    @keyframes pop {
      from { transform: scale(1.28); }
      to { transform: scale(1); }
    }

    #pista {
      position: absolute;
      z-index: 2;
      left: 16px;
      right: 16px;
      bottom: 14%;
      margin: 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff8df;
      text-shadow: 0 2px 0 #3a1016, 0 0 12px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .capa {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    [hidden] { display: none !important; }

    .panel {
      position: relative;
      width: min(92vw, 420px);
      max-height: 100%;
      overflow: hidden;
      padding: 18px 18px 20px;
      text-align: center;
      background: linear-gradient(165deg, rgba(122, 31, 43, 0.94), rgba(32, 8, 12, 0.92));
      border: 1px solid rgba(212, 160, 23, 0.75);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -48deg,
        transparent,
        transparent 10px,
        rgba(212, 160, 23, 0.06) 10px,
        rgba(212, 160, 23, 0.06) 11px
      );
      pointer-events: none;
    }

    .panel > * { position: relative; z-index: 1; }

    /* El escudo se muestra con su proporción real. Si no carga, el script lo quita. */
    .escudo {
      display: block;
      width: auto;
      height: auto;
      max-width: min(42vw, 168px);
      max-height: min(24vh, 210px);
      margin: 0 auto 4px;
      object-fit: contain;
      background: transparent;
      filter: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .fila-final {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 4px;
    }

    .escudo-chico {
      max-width: min(28vw, 108px);
      max-height: min(18vh, 132px);
      margin: 0;
    }

    h1 {
      margin: 2px 0 8px;
      font-family: "Arial Black", Impact, "Haettenschweiler", sans-serif;
      font-size: clamp(40px, 12vw, 64px);
      line-height: 0.88;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #d4a017;
      text-shadow: 0 3px 0 #4a1018;
    }

    .bajada {
      margin: 0 auto 12px;
      max-width: 34ch;
      font-size: 15px;
      line-height: 1.45;
      color: #f6e7b2;
    }

    .etiqueta {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f6e7b2;
    }

    .grande {
      margin: 0;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: clamp(56px, 16vw, 84px);
      line-height: 0.9;
      color: #fff8df;
      font-variant-numeric: tabular-nums;
    }

    .frase, .record-linea, #aviso-record {
      margin: 8px 0 0;
      font-size: 15px;
      line-height: 1.4;
      color: #f6e7b2;
    }

    #aviso-record {
      color: #d4a017;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    button {
      appearance: none;
      margin-top: 16px;
      min-height: 52px;
      min-width: 180px;
      padding: 0 26px;
      border: 2px solid #d4a017;
      border-radius: 999px;
      background: #7a1f2b;
      color: #fff8df;
      font: inherit;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 6px 0 #4a1018;
      cursor: pointer;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #4a1018;
    }

    button:focus-visible {
      outline: 3px solid #fff8df;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: no-preference) {
      #btn-jugar {
        animation: brillo 1.8s ease-in-out infinite;
      }
    }

    @keyframes brillo {
      0%, 100% { box-shadow: 0 6px 0 #4a1018; }
      50% { box-shadow: 0 6px 0 #4a1018, 0 0 0 7px rgba(212, 160, 23, 0.22); }
    }

    @media (prefers-reduced-motion: reduce) {
      .golpe { animation: none; }
    }

    @media (max-height: 700px) {
      .escudo { max-height: 16vh; }
      .bajada { font-size: 13px; margin-bottom: 8px; }
      h1 { font-size: 36px; }
      .panel { padding: 12px 14px 14px; }
      button { margin-top: 10px; min-height: 46px; }
    }

    footer {
      flex: 0 0 auto;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.02em;
      background: #7a1f2b;
      color: #f6e7b2;
      border-top: 2px solid #d4a017;
    }

    footer a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body data-fase="inicio">
  <div id="escenario">
    <canvas id="cancha" width="360" height="640"></canvas>

    <div id="hud" hidden>
      <div class="placa">
        <span>Puntos</span>
        <strong id="puntos" aria-live="polite">0</strong>
      </div>
      <div class="placa">
        <span>Récord</span>
        <strong id="record-hud">0</strong>
      </div>
    </div>

    <p id="pista" hidden>Toca el balón</p>

    <div id="pantalla-inicio" class="capa">
      <div class="panel">
        <img
          class="escudo"
          alt="Escudo del Deportes Tolima"
          draggable="false"
          onerror="this.remove()"
          src="escudo.png"
        >
        <h1>Dominadas</h1>
        <p class="bajada">Toca el balón para subirlo. El lado del toque lo manda a la izquierda o a la derecha. Si cae al suelo, se acaba.</p>
        <p class="record-linea">Récord: <span id="record-inicio">0</span></p>
        <button type="button" id="btn-jugar">Jugar</button>
      </div>
    </div>

    <div id="pantalla-final" class="capa" hidden>
      <div class="panel">
        <div class="fila-final">
          <img
            class="escudo escudo-chico"
            alt="Escudo del Deportes Tolima"
            draggable="false"
            onerror="this.remove()"
            src="escudo.png"
          >
          <div>
            <p class="etiqueta">Puntaje</p>
            <p class="grande" id="puntaje-final">0</p>
          </div>
        </div>
        <p class="frase" id="frase"></p>
        <p id="aviso-record" hidden>¡Nuevo récord!</p>
        <p class="record-linea">Récord: <span id="record-final">0</span></p>
        <button type="button" id="btn-reintentar">Jugar de nuevo</button>
      </div>
    </div>
  </div>

  <footer>Un juego de <a href="https://deportestolima.com.co" target="_blank" rel="noopener noreferrer">deportestolima.com.co</a></footer>

  <script>
    "use strict";

    /* ---------- Referencias de la interfaz ---------- */
    const escenario = document.getElementById("escenario");
    const lienzo = document.getElementById("cancha");
    const ctx = lienzo.getContext("2d");
    const hud = document.getElementById("hud");
    const elPuntos = document.getElementById("puntos");
    const elRecordHud = document.getElementById("record-hud");
    const elRecordInicio = document.getElementById("record-inicio");
    const pista = document.getElementById("pista");
    const pantallaInicio = document.getElementById("pantalla-inicio");
    const pantallaFinal = document.getElementById("pantalla-final");
    const fondo = document.createElement("canvas");
    const ctxFondo = fondo.getContext("2d");

    const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---------- Récord en este dispositivo ---------- */
    const CLAVE_RECORD = "dominadas-record";

    function leerRecord() {
      try {
        const bruto = localStorage.getItem(CLAVE_RECORD);
        const n = parseInt(bruto, 10);
        if (!Number.isFinite(n) || n < 0) return 0;
        return n;
      } catch (e) {
        return 0;
      }
    }

    function guardarRecord(n) {
      try {
        localStorage.setItem(CLAVE_RECORD, String(n));
      } catch (e) {
        /* Navegación privada o iframe sin almacenamiento: la partida sigue. */
      }
    }

    /* ---------- Estado de la partida ---------- */
    let ancho = 0;
    let alto = 0;
    let dpr = 1;
    let fase = "inicio"; /* inicio | jugando | final */
    let puntos = 0;
    let record = leerRecord();
    let recordAlEmpezar = record;
    let superoRecord = false;
    let segundos = 0;
    let ultimoGolpe = 0;
    let yUltimoGolpe = null;
    let viajeDesdeGolpe = 0;
    let bloquearRatonHasta = 0;
    let sacudida = 0;
    let flashIzq = 0;
    let flashDer = 0;

    const bola = { x: 0, y: 0, vx: 0, vy: 0, r: 32, rot: 0, squash: 0 };
    const particulas = [];
    const anillos = [];
    const textos = [];

    elRecordInicio.textContent = String(record);
    elRecordHud.textContent = String(record);

    /* Unidad para que la física se sienta igual en un celular y en una pantalla grande. */
    function unidad() {
      return Math.max(alto, 1) / 800;
    }

    function radioActual() {
      return Math.max(28, Math.min(ancho * 0.075, alto * 0.055, 64));
    }

    /* La gravedad sube con el tiempo y con los toques, con un techo para que siga siendo jugable. */
    function gravedadActual() {
      const g = 1120 + segundos * 34 + puntos * 6;
      return Math.min(3000, g) * unidad();
    }

    function marcarFase(siguiente) {
      fase = siguiente;
      document.body.dataset.fase = siguiente;
    }

    function actualizarMarcador() {
      elPuntos.textContent = String(puntos);
      elRecordHud.textContent = String(record);
      elRecordInicio.textContent = String(record);
      if (!quieto) {
        elPuntos.classList.remove("golpe");
        void elPuntos.offsetWidth;
        elPuntos.classList.add("golpe");
      }
    }

    function frase(n) {
      if (n <= 0) return "El balón tocó el suelo";
      if (n < 8) return "Vas calentando";
      if (n < 20) return "Buen pie";
      if (n < 40) return "La tribuna se enciende";
      return "Dominadas de crack";
    }

    function empezar() {
      marcarFase("jugando");
      puntos = 0;
      segundos = 0;
      recordAlEmpezar = record;
      superoRecord = false;
      ultimoGolpe = 0;
      yUltimoGolpe = null;
      viajeDesdeGolpe = 0;
      sacudida = 0;
      particulas.length = 0;
      anillos.length = 0;
      textos.length = 0;
      bola.r = radioActual();
      bola.x = ancho * 0.5;
      bola.y = Math.max(bola.r + 24, alto * 0.34);
      bola.vx = 0;
      bola.vy = 36 * unidad();
      bola.rot = 0;
      bola.squash = 0;
      actualizarMarcador();
      pantallaInicio.hidden = true;
      pantallaFinal.hidden = true;
      hud.hidden = false;
      pista.hidden = false;
    }

    function terminar() {
      if (fase !== "jugando") return;
      marcarFase("final");
      bola.vy = 0;
      bola.vx *= 0.2;
      bola.y = Math.min(bola.y, alto - bola.r - 2);
      hud.hidden = true;
      pista.hidden = true;
      document.getElementById("puntaje-final").textContent = String(puntos);
      document.getElementById("record-final").textContent = String(record);
      document.getElementById("frase").textContent = frase(puntos);
      document.getElementById("aviso-record").hidden = !(superoRecord && puntos > recordAlEmpezar);
      pantallaFinal.hidden = false;
      sonidoSuelo();
    }

    /* ---------- Sonido corto, desbloqueado con el primer gesto ---------- */
    let audio = null;

    function asegurarAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audio) audio = new AC();
        if (audio.state === "suspended") audio.resume();
        return audio;
      } catch (e) {
        return null;
      }
    }

    function tono(frecuencia, duracion, tipo, volumen) {
      const ac = asegurarAudio();
      if (!ac) return;
      try {
        const osc = ac.createOscillator();
        const gan = ac.createGain();
        osc.type = tipo;
        osc.frequency.setValueAtTime(frecuencia, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, frecuencia * 0.45), ac.currentTime + duracion);
        gan.gain.setValueAtTime(volumen, ac.currentTime);
        gan.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duracion);
        osc.connect(gan);
        gan.connect(ac.destination);
        osc.start();
        osc.stop(ac.currentTime + duracion + 0.02);
      } catch (e) {
        /* Sin audio no se corta la partida. */
      }
    }

    function sonidoToque() { tono(210, 0.09, "sine", 0.12); }
    function sonidoBorde() { tono(140, 0.06, "triangle", 0.05); }
    function sonidoSuelo() { tono(90, 0.18, "sine", 0.14); }

    /* ---------- Efecto visual de cada toque ---------- */
    function explotar(x, y) {
      const colores = ["#d4a017", "#f6e7b2", "#ffffff", "#7a1f2b"];
      const n = quieto ? 6 : 16;
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = (70 + Math.random() * 240) * unidad();
        particulas.push({
          x: x,
          y: y,
          vx: Math.cos(ang) * vel,
          vy: Math.sin(ang) * vel - 30 * unidad(),
          vida: 1,
          r: 2 + Math.random() * 3.2,
          color: colores[i % colores.length],
        });
      }
      if (particulas.length > 90) particulas.splice(0, particulas.length - 90);
    }

    /* El toque a la derecha manda el balón a la derecha, y al revés.
       No se puede repetir el golpe hasta que el balón haya caído un trecho:
       así cada punto es una dominada y no un toque seguido en el mismo sitio. */
    function intentarToque(x, y) {
      if (fase !== "jugando") return;
      if (bola.y + bola.r < 8) return;
      const ahoraMs = performance.now();
      if (ahoraMs - ultimoGolpe < 160) return;
      if (bola.vy < -80 * unidad()) return;
      if (yUltimoGolpe !== null && viajeDesdeGolpe < bola.r * 1.15) return;

      const dx = x - bola.x;
      const dy = y - bola.y;
      const alcance = bola.r + Math.max(22, bola.r * 0.62);
      if (dx * dx + dy * dy > alcance * alcance) return;

      ultimoGolpe = ahoraMs;
      yUltimoGolpe = bola.y;
      viajeDesdeGolpe = 0;
      const u = unidad();
      const lado = Math.max(-1, Math.min(1, dx / Math.max(bola.r, 1)));
      bola.vx = lado * 540 * u;
      const techo = 78 + bola.r;
      const g = Math.max(gravedadActual(), 1);
      let vy = -980 * u;
      if (bola.y > techo) {
        const tope = -Math.sqrt(2 * g * (bola.y - techo));
        vy = Math.max(tope, vy);
      } else {
        vy = 60 * u;
      }
      bola.vy = vy;
      bola.squash = 1;
      puntos += 1;
      if (puntos > record) {
        record = puntos;
        superoRecord = true;
        guardarRecord(record);
      }
      if (puntos === 1) pista.hidden = true;
      if (!quieto) sacudida = 1;
      explotar(bola.x, bola.y);
      anillos.push({ x: bola.x, y: bola.y, r: bola.r * 0.7, vida: 1 });
      textos.push({ x: bola.x, y: bola.y - bola.r - 8, vida: 1, texto: "+1" });
      sonidoToque();
      actualizarMarcador();
    }

    function coordenada(clientX, clientY) {
      const rect = lienzo.getBoundingClientRect();
      const escalaX = rect.width > 0 ? ancho / rect.width : 1;
      const escalaY = rect.height > 0 ? alto / rect.height : 1;
      return {
        x: (clientX - rect.left) * escalaX,
        y: (clientY - rect.top) * escalaY,
      };
    }

    /* Toque (dedo) y ratón, sin contar dos veces el mismo golpe. */
    lienzo.addEventListener("touchstart", function (ev) {
      ev.preventDefault();
      bloquearRatonHasta = performance.now() + 800;
      const t = ev.changedTouches[0];
      if (!t) return;
      const p = coordenada(t.clientX, t.clientY);
      intentarToque(p.x, p.y);
    }, { passive: false });

    lienzo.addEventListener("mousedown", function (ev) {
      if (performance.now() < bloquearRatonHasta) return;
      if (ev.button !== 0) return;
      const p = coordenada(ev.clientX, ev.clientY);
      intentarToque(p.x, p.y);
    });

    lienzo.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

    /* Solo el lienzo bloquea el arrastre. En los botones el click del celular debe vivir. */
    lienzo.addEventListener("touchmove", function (ev) {
      ev.preventDefault();
    }, { passive: false });

    document.addEventListener("gesturestart", function (ev) { ev.preventDefault(); }, { passive: false });
    document.addEventListener("gesturechange", function (ev) { ev.preventDefault(); }, { passive: false });

    /* El toque en toda la pantalla de inicio arranca la partida.
       En el celular, preventDefault en touchmove anula el click, así que
       también escuchamos touchend. */
    function arrancarDesdePantalla(ev) {
      if (ev.target && ev.target.closest && ev.target.closest("a")) return;
      if (ev.type === "touchend") {
        ev.preventDefault();
        bloquearRatonHasta = performance.now() + 700;
      } else if (performance.now() < bloquearRatonHasta) {
        return;
      }
      asegurarAudio();
      empezar();
    }

    pantallaInicio.addEventListener("touchend", arrancarDesdePantalla);
    pantallaInicio.addEventListener("click", arrancarDesdePantalla);

    document.getElementById("btn-reintentar").addEventListener("touchend", function (ev) {
      ev.preventDefault();
      bloquearRatonHasta = performance.now() + 700;
      asegurarAudio();
      empezar();
    });
    document.getElementById("btn-reintentar").addEventListener("click", function () {
      if (performance.now() < bloquearRatonHasta) return;
      asegurarAudio();
      empezar();
    });

    document.addEventListener("keydown", function (ev) {
      if (ev.key === " " || ev.key === "Spacebar") ev.preventDefault();
      if (ev.key === "Enter" && fase === "inicio") {
        asegurarAudio();
        empezar();
      }
    });

    /* ---------- Física a paso fijo ---------- */
    function actualizar(dt) {
      flashIzq = Math.max(0, flashIzq - dt * 3);
      flashDer = Math.max(0, flashDer - dt * 3);
      sacudida = Math.max(0, sacudida - dt * 3.4);
      bola.squash = Math.max(0, bola.squash - dt * 6);

      for (let i = particulas.length - 1; i >= 0; i--) {
        const p = particulas[i];
        p.vida -= dt * 1.7;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 520 * unidad() * dt;
        if (p.vida <= 0) particulas.splice(i, 1);
      }
      for (let i = anillos.length - 1; i >= 0; i--) {
        anillos[i].vida -= dt * 2.1;
        anillos[i].r += dt * 140 * unidad();
        if (anillos[i].vida <= 0) anillos.splice(i, 1);
      }
      for (let i = textos.length - 1; i >= 0; i--) {
        textos[i].vida -= dt * 0.95;
        textos[i].y -= dt * 46 * unidad();
        if (textos[i].vida <= 0) textos.splice(i, 1);
      }

      if (fase !== "jugando" || alto < 40 || ancho < 40) return;

      segundos += dt;
      bola.vy += gravedadActual() * dt;
      bola.x += bola.vx * dt;
      bola.y += bola.vy * dt;
      bola.rot += bola.vx * dt * 0.012;
      if (yUltimoGolpe !== null) {
        viajeDesdeGolpe = Math.max(viajeDesdeGolpe, Math.abs(bola.y - yUltimoGolpe));
      }

      /* Rebote en los bordes laterales. */
      if (bola.x < bola.r) {
        bola.x = bola.r;
        bola.vx = Math.abs(bola.vx) * 0.9;
        flashIzq = 1;
        sonidoBorde();
      } else if (bola.x > ancho - bola.r) {
        bola.x = ancho - bola.r;
        bola.vx = -Math.abs(bola.vx) * 0.9;
        flashDer = 1;
        sonidoBorde();
      }

      if (bola.y + bola.r >= alto - 2) {
        bola.y = alto - bola.r - 2;
        terminar();
      }
    }

    /* ---------- Estadio (se redibuja solo al cambiar el tamaño) ---------- */
    function pintarFondo() {
      const w = Math.max(1, Math.round(ancho));
      const h = Math.max(1, Math.round(alto));
      fondo.width = w;
      fondo.height = h;
      const g = ctxFondo;
      g.setTransform(1, 0, 0, 1, 0, 0);

      const cielo = g.createLinearGradient(0, 0, 0, h * 0.46);
      cielo.addColorStop(0, "#12060a");
      cielo.addColorStop(0.55, "#4a1520");
      cielo.addColorStop(1, "#7a1f2b");
      g.fillStyle = cielo;
      g.fillRect(0, 0, w, h);

      pintarLuz(g, w * 0.14, h * 0.05, Math.min(w, h));
      pintarLuz(g, w * 0.86, h * 0.05, Math.min(w, h));
      pintarGradas(g, w, h);

      const vallaY = h * 0.335;
      const vallaH = Math.max(26, h * 0.048);
      g.fillStyle = "#7a1f2b";
      g.fillRect(0, vallaY, w, vallaH);
      g.fillStyle = "#d4a017";
      g.fillRect(0, vallaY, w, 3);
      g.fillRect(0, vallaY + vallaH - 3, w, 3);
      g.fillStyle = "#f6e7b2";
      g.font = "700 " + Math.max(11, Math.min(16, w * 0.03)) + "px Trebuchet MS, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      const letrero = "DEPORTES TOLIMA";
      const paso = g.measureText(letrero).width + 28;
      for (let x = paso * 0.5; x < w + paso; x += paso) {
        g.fillText(letrero, x, vallaY + vallaH * 0.52);
      }

      const cespedY = vallaY + vallaH;
      const cespedH = h - cespedY;
      const franjas = 8;
      for (let i = 0; i < franjas; i++) {
        g.fillStyle = i % 2 === 0 ? "#187a3c" : "#146b34";
        const fh = cespedH / franjas;
        g.fillRect(0, cespedY + i * fh, w, fh + 1);
      }

      const vineta = g.createRadialGradient(w / 2, cespedY + cespedH * 0.45, w * 0.15, w / 2, cespedY + cespedH * 0.5, w * 0.72);
      vineta.addColorStop(0, "rgba(0,0,0,0)");
      vineta.addColorStop(1, "rgba(0,0,0,0.28)");
      g.fillStyle = vineta;
      g.fillRect(0, cespedY, w, cespedH);

      g.strokeStyle = "rgba(255,255,255,0.8)";
      g.lineWidth = Math.max(2, w * 0.004);
      const margen = w * 0.07;
      const top = cespedY + cespedH * 0.07;
      const bot = h - Math.max(10, cespedH * 0.04);
      g.strokeRect(margen, top, w - margen * 2, bot - top);
      const medio = (top + bot) / 2;
      g.beginPath();
      g.moveTo(margen, medio);
      g.lineTo(w - margen, medio);
      g.stroke();
      g.beginPath();
      g.arc(w / 2, medio, Math.min(w, cespedH) * 0.12, 0, Math.PI * 2);
      g.stroke();
      const areaW = (w - margen * 2) * 0.58;
      const areaH = (bot - top) * 0.18;
      g.strokeRect((w - areaW) / 2, top, areaW, areaH);
      g.strokeRect((w - areaW) / 2, bot - areaH, areaW, areaH);

      g.strokeStyle = "rgba(212,160,23,0.95)";
      g.lineWidth = 4;
      g.beginPath();
      g.moveTo(0, h - 2);
      g.lineTo(w, h - 2);
      g.stroke();
    }

    function pintarLuz(g, x, y, base) {
      const radio = base * 0.16;
      const luz = g.createRadialGradient(x, y, 0, x, y, radio);
      luz.addColorStop(0, "rgba(255, 236, 190, 0.95)");
      luz.addColorStop(0.3, "rgba(212, 160, 23, 0.35)");
      luz.addColorStop(1, "rgba(212, 160, 23, 0)");
      g.fillStyle = luz;
      g.beginPath();
      g.arc(x, y, radio, 0, Math.PI * 2);
      g.fill();
    }

    function pintarGradas(g, w, h) {
      const y0 = h * 0.07;
      const y1 = h * 0.33;
      const filas = 8;
      let semilla = 17;
      const azar = function () {
        semilla = (semilla * 48271) % 2147483647;
        return semilla / 2147483647;
      };
      for (let f = 0; f < filas; f++) {
        const y = y0 + ((y1 - y0) * f) / filas;
        const altoFila = (y1 - y0) / filas;
        g.fillStyle = f % 2 === 0 ? "#5e1824" : "#461018";
        g.fillRect(0, y, w, altoFila + 0.6);
        const paso = 12;
        for (let x = 6; x < w; x += paso) {
          const t = azar();
          if (t < 0.2) continue;
          if (t > 0.93) g.fillStyle = "#d4a017";
          else if (t > 0.8) g.fillStyle = "#f4f4f4";
          else if (t > 0.55) g.fillStyle = "#9a3040";
          else g.fillStyle = "#24080d";
          g.beginPath();
          g.arc(x, y + altoFila * 0.55, 2.3, 0, Math.PI * 2);
          g.fill();
        }
      }
    }

    function pentagono(g, x, y, r, rot) {
      g.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = rot - Math.PI / 2 + (i * 2 * Math.PI) / 5;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) g.moveTo(px, py);
        else g.lineTo(px, py);
      }
      g.closePath();
      g.fill();
    }

    function dibujarBalon(x, y, r, rot, squash) {
      const suelo = alto - 3;
      const altura = Math.max(0, (suelo - (y + r)) / Math.max(alto, 1));
      ctx.fillStyle = "rgba(0,0,0," + (0.33 - altura * 0.16) + ")";
      ctx.beginPath();
      ctx.ellipse(x, suelo, r * (0.9 - altura * 0.25), Math.max(3, r * 0.22), 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1 + squash * 0.18, 1 - squash * 0.22);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.save();
      ctx.clip();

      const base = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      base.addColorStop(0, "#ffffff");
      base.addColorStop(0.55, "#f3f3f3");
      base.addColorStop(1, "#c8c8c8");
      ctx.fillStyle = base;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      ctx.fillStyle = "#1a1a1a";
      pentagono(ctx, 0, 0, r * 0.34, -Math.PI / 2);
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
        pentagono(ctx, Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.26, a);
      }

      const borde = ctx.createRadialGradient(0, r * 0.2, r * 0.3, 0, 0, r);
      borde.addColorStop(0, "rgba(0,0,0,0)");
      borde.addColorStop(1, "rgba(0,0,0,0.32)");
      ctx.fillStyle = borde;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(2, r * 0.055);
      ctx.strokeStyle = "#d4a017";
      ctx.stroke();
      ctx.restore();

      /* Brillo fijo, para que el balón no se vea plano. */
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1 + squash * 0.18, 1 - squash * 0.22);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = "rgba(255,255,255,0.42)";
      ctx.beginPath();
      ctx.ellipse(-r * 0.28, -r * 0.32, r * 0.3, r * 0.16, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function dibujar(tiempo) {
      if (ancho < 2 || alto < 2) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#146b34";
      ctx.fillRect(-30, -30, ancho + 60, alto + 60);

      ctx.save();
      if (sacudida > 0) {
        ctx.translate((Math.random() - 0.5) * 8 * sacudida, (Math.random() - 0.5) * 6 * sacudida);
      }
      ctx.drawImage(fondo, 0, 0, ancho, alto);

      let bx = bola.x;
      let by = bola.y;
      let br = bola.r || radioActual();
      let brot = bola.rot;
      let bsq = bola.squash;
      if (fase === "inicio") {
        br = radioActual();
        bx = ancho * 0.5 + (quieto ? 0 : Math.sin(tiempo * 0.85) * Math.min(64, ancho * 0.1));
        const rebote = quieto ? 0 : Math.abs(Math.sin(tiempo * 2.1)) * 16;
        by = alto - br - 22 - rebote;
        brot = quieto ? 0.4 : tiempo * 0.6;
        bsq = 0;
      }

      dibujarBalon(bx, by, br, brot, bsq);

      for (let i = 0; i < anillos.length; i++) {
        const an = anillos[i];
        ctx.beginPath();
        ctx.arc(an.x, an.y, an.r, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(212,160,23," + Math.max(an.vida, 0) + ")";
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      for (let i = 0; i < particulas.length; i++) {
        const p = particulas[i];
        ctx.globalAlpha = Math.max(p.vida, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.font = "800 22px Arial Black, Impact, sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      for (let i = 0; i < textos.length; i++) {
        const t = textos[i];
        ctx.globalAlpha = Math.max(t.vida, 0);
        ctx.strokeStyle = "#7a1f2b";
        ctx.fillStyle = "#f6e7b2";
        ctx.strokeText(t.texto, t.x, t.y);
        ctx.fillText(t.texto, t.x, t.y);
      }
      ctx.globalAlpha = 1;

      if (flashIzq > 0) {
        ctx.fillStyle = "rgba(212,160,23," + (0.35 * flashIzq) + ")";
        ctx.fillRect(0, 0, 12, alto);
      }
      if (flashDer > 0) {
        ctx.fillStyle = "rgba(212,160,23," + (0.35 * flashDer) + ")";
        ctx.fillRect(ancho - 12, 0, 12, alto);
      }
      ctx.restore();
    }

    /* ---------- Tamaño del canvas (nítido en pantallas retina) ---------- */
    function medir() {
      const rect = escenario.getBoundingClientRect();
      const prevW = ancho;
      const prevH = alto;
      const nuevoAncho = Math.max(1, rect.width);
      const nuevoAlto = Math.max(1, rect.height);
      if (nuevoAncho < 2 || nuevoAlto < 2) return;
      ancho = nuevoAncho;
      alto = nuevoAlto;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      lienzo.width = Math.round(ancho * dpr);
      lienzo.height = Math.round(alto * dpr);
      if (fase === "jugando" && prevW > 0 && prevH > 0 &&
          (Math.abs(prevW - ancho) > 0.5 || Math.abs(prevH - alto) > 0.5)) {
        bola.x *= ancho / prevW;
        bola.y *= alto / prevH;
        bola.vx *= alto / prevH;
        bola.vy *= alto / prevH;
      }
      bola.r = radioActual();
      pintarFondo();
    }

    if (typeof ResizeObserver === "function") {
      new ResizeObserver(medir).observe(escenario);
    }
    window.addEventListener("resize", medir);

    let ultimo = performance.now();
    let acumulado = 0;
    const PASO = 1 / 60;

    function cuadro(ahora) {
      const dt = Math.min(0.05, (ahora - ultimo) / 1000);
      ultimo = ahora;
      if (!document.hidden) {
        acumulado += dt;
        let pasos = 0;
        while (acumulado >= PASO && pasos < 5) {
          actualizar(PASO);
          acumulado -= PASO;
          pasos += 1;
        }
      } else {
        acumulado = 0;
      }
      dibujar(ahora / 1000);
      requestAnimationFrame(cuadro);
    }

    medir();
    requestAnimationFrame(cuadro);

    /* Gancho de prueba: no afecta la partida. */
    window.__dominadas = {
      get fase() { return fase; },
      get puntos() { return puntos; },
      get record() { return record; },
      bola: function () {
        return { x: bola.x, y: bola.y, r: bola.r, vx: bola.vx, vy: bola.vy };
      },
    };
  </script>
</body>
